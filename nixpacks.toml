# Adds Python (via pip) alongside Railway's auto-detected Node.js setup, so we can
# pip-install a real (non-frozen) yt-dlp plus the bgutil-ytdlp-pot-provider plugin.
# yt-dlp's standalone/PyInstaller-frozen binary builds cannot load external Python
# plugins at all (confirmed directly: --plugin-dirs is silently ignored) — a genuine
# pip install is required for PO token support to work. The "..." entries extend
# Railway's auto-detected Node config instead of replacing it.
[phases.setup]
nixPkgs = ["...", "python3", "python3Packages.pip"]

[phases.install]
cmds = ["...", "pip install --break-system-packages yt-dlp bgutil-ytdlp-pot-provider"]
